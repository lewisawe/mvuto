<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mvuto — Gravity Sandbox</title>
  </head>
  <body>
    <canvas id="sim"></canvas>

    <div id="panel" class="panel">
      <header class="panel__header">
        <h1 class="panel__title">Mvuto</h1>
        <p class="panel__subtitle">gravity sandbox</p>
      </header>

      <div class="panel__row">
        <button id="btn-play" class="btn btn--primary" type="button">Pause</button>
        <button id="btn-reset" class="btn" type="button">Reset</button>
        <button id="btn-clear" class="btn" type="button">Clear</button>
      </div>

      <label class="field">
        <span class="field__label">Timestep <output id="out-dt">1.00</output></span>
        <input id="slider-dt" class="slider" type="range" min="0.1" max="3" step="0.05" value="1" />
      </label>

      <label class="field">
        <span class="field__label">Gravity (G) <output id="out-g">1.00</output></span>
        <input id="slider-g" class="slider" type="range" min="0" max="5" step="0.05" value="1" />
      </label>

      <div class="field">
        <span class="field__label">Presets</span>
        <div id="preset-buttons" class="panel__row panel__row--wrap"></div>
      </div>

      <p class="panel__hint">Drag on the canvas and release to slingshot a new body.</p>
    </div>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
